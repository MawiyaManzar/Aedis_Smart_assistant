name: aedis

# Local stack for Developer 1.
# API Gateway, workers, and the Next.js dashboard belong to Developer 2 and are not defined here.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aedis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aedis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aedis_password}
      POSTGRES_DB: ${POSTGRES_DB:-aedis_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: aedis-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  neo4j:
    image: neo4j:5.18-community
    container_name: aedis-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aedis_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  ml-service:
    build: ./services/ml-service
    container_name: aedis-ml-service
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    environment:
      MODEL_ENV: ${MODEL_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aedis_admin}:${POSTGRES_PASSWORD:-aedis_password}@postgres:5432/${POSTGRES_DB:-aedis_db}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aedis_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  neo4jdata:
