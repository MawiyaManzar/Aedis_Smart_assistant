[project]
name = "aedis-ml-service"
version = "0.1.0"
description = "Developer 1 FastAPI service for fraud scoring, loan-distress scoring, and SHAP explainability."
authors = [
    { name = "Dipanshu CHoudhary", email = "Dipanshuchoudhary109@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "lightgbm>=4.7.0",
    "neo4j>=6.3.1",
    "numpy>=2.4.6",
    "onnx>=1.23.1",
    "onnxruntime>=1.30.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
